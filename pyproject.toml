[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openrail-metrics"
version = "0.1.0"
description = "Quarterly metrics reporting tool for OpenRail Association"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.scripts]
openrail-metrics = "openrail_metrics.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
